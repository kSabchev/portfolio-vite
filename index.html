      rel="stylesheet"
    />
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      const stored = localStorage.getItem('theme')
      const light = stored === 'light' || (!stored && window.matchMedia('(prefers-color-scheme: light)').matches)
      if (light) document.documentElement.classList.remove('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
